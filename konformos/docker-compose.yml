services:
  db:
    image: postgres:16
    environment:
      # Bootstrap superuser only — the app connects as the NOSUPERUSER role
      # `konformos` created by docker/initdb (superusers bypass RLS, which
      # would silently disable org isolation — INV-ORG-01).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_bootstrap
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://konformos:konformos_dev@db:5432/konformos
      KONFORMOS_REQUIRE_RLS: "1"  # refuse to start if the DB role bypasses RLS
      KONFORMOS_JWT_SECRET: ${KONFORMOS_JWT_SECRET:?set a real secret}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ../docs/rules-catalog:/app/rules-catalog:ro
      - storage:/data/storage
    ports:
      - "8000:8000"

volumes:
  pgdata:
  storage:
